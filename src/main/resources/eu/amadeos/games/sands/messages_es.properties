dialog.about.text=Un planeta desierto, y la especia bajo su arena. Coséchala, construye con los créditos que trae una base y un ejército, y expulsa al enemigo del planeta. Cuidado con el gusano: caza lo que se mueve por la arena abierta. Tres misiones; se guarda la victoria más rápida de cada una.
dialog.about.rules=El clic izquierdo elige, un recuadro con el botón izquierdo elige a muchos, el botón derecho da la orden: atacar a un enemigo, cosechar especia, ir a algún sitio; con Ctrl, abrirse paso luchando. Ctrl y un número guardan un grupo, el número lo vuelve a elegir. El panel de la derecha construye; un edificio listo espera su sitio en la roca. F5 guarda la batalla, F9 la carga; F3 muestra dónde te cree fuerte el ordenador.

