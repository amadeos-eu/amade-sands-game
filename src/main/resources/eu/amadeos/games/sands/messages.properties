window.title=Sands
menu.game.pause=&Pause
menu.game.sound=&Sound
dialog.about.text=A desert planet, and the crystals under its sand. Harvest them, build a base and an army with the credits they bring, and drive the enemy from the planet. Beware of the burrower: it hunts what drives on open sand. Three missions; the fastest win of each is saved.
dialog.about.rules=Left click chooses, a box drawn with the left button chooses many, the right button orders: to attack an enemy, to harvest crystals, to drive somewhere; with Ctrl, to fight the way there. Ctrl and a number keeps a group, the number chooses it again. The panel on the right builds; a building that is ready waits for its place on the rock. F5 saves the battle, F9 loads it; F3 shows where the computer thinks you are strong.

title.subtitle=Harvest the crystals · build your base · drive out the enemy
title.start=Click or press Enter: choose a mission
title.mouse=Left button: choose, or draw a box · right button: move, attack, harvest · the panel builds
title.keys=Arrow keys, the middle button or the edge of the screen move the map · Ctrl and 1 to 9 keep a group
title.load=F9 loads the saved battle
title.screen=P or Esc pauses · F5 saves · F3 shows the computer's view · F11 full screen · F12 frame times

