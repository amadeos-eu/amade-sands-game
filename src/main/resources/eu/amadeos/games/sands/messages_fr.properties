window.title=Sands
menu.game.pause=&Pause
menu.game.sound=&Son
dialog.about.text=Une planète désertique, et les cristaux sous son sable. Récolte-les, bâtis avec les crédits qu’ils rapportent une base et une armée, et chasse l’ennemi de la planète. Prends garde au fouisseur : il chasse ce qui roule sur le sable nu. Trois missions ; la victoire la plus rapide de chacune est enregistrée.
dialog.about.rules=Le clic gauche choisit, un cadre tiré avec le bouton gauche en choisit plusieurs, le bouton droit donne l’ordre : attaquer un ennemi, récolter les cristaux, rouler quelque part ; avec Ctrl, s’y frayer un chemin en combattant. Ctrl et un chiffre gardent un groupe, le chiffre le choisit de nouveau. Le panneau de droite construit ; un bâtiment prêt attend sa place sur la roche. F5 enregistre la bataille, F9 la charge ; F3 montre où l’ordinateur te croit fort.

