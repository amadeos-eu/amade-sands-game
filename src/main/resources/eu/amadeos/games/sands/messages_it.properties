window.title=Sands
menu.game.pause=&Pausa
menu.game.sound=&Suono
dialog.about.text=Un pianeta deserto, e i cristalli sotto la sua sabbia. Raccoglili, costruisci con i crediti che portano una base e un esercito, e caccia il nemico dal pianeta. Attento allo scavatore: dà la caccia a ciò che si muove sulla sabbia aperta. Tre missioni; la vittoria più rapida di ognuna viene salvata.
dialog.about.rules=Il clic sinistro sceglie, un riquadro tracciato col tasto sinistro ne sceglie molti, il tasto destro dà l’ordine: attaccare un nemico, raccogliere cristalli, andare da qualche parte; con Ctrl, farsi strada combattendo. Ctrl e un numero tengono un gruppo, il numero lo sceglie di nuovo. Il pannello a destra costruisce; un edificio pronto aspetta il suo posto sulla roccia. F5 salva la battaglia, F9 la carica; F3 mostra dove il computer ti crede forte.

