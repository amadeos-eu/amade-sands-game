# Texte von amade-sands-game, Deutsch. UTF-8.
window.title=Sands
menu.game.pause=&Pause
menu.game.sound=&Ton
dialog.about.text=Ein Wüstenplanet und das Spice unter seinem Sand. Ernte es, bau mit den Credits, die es bringt, eine Basis und eine Armee, und vertreibe den Feind vom Planeten. Hüte dich vor dem Wurm: Er jagt, was auf offenem Sand fährt. Drei Missionen; der schnellste Sieg in jeder wird gespeichert.
dialog.about.rules=Linksklick wählt, ein Rahmen mit der linken Taste wählt viele, die rechte Taste befiehlt: einen Feind angreifen, Spice ernten, irgendwohin fahren; mit Strg kämpfen sie sich dorthin. Strg und eine Zahl merken eine Gruppe, die Zahl wählt sie wieder. Rechts wird gebaut; ein fertiges Gebäude wartet auf seinen Platz auf dem Fels. F5 speichert die Schlacht, F9 lädt sie; F3 zeigt, wo der Computer dich für stark hält.

